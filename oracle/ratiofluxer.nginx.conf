# Ratio-Fluxer paper dashboard (static, same pattern as /nifty/)
location = /ratiofluxer { return 301 /ratiofluxer/; }
location = /ratiofluxer/ {
    root /home/ubuntu/paper/docs;
    try_files /ratiofluxer.html =404;
}
location = /ratiofluxer/index.html {
    root /home/ubuntu/paper/docs;
    try_files /ratiofluxer.html =404;
}
# data files the Ratio-Fluxer dashboard fetches
location ~ ^/results/(rf_trades\.csv|rf_state\.json|rf_trade\.log)$ {
    root /home/ubuntu/paper;
    default_type text/plain;
}
